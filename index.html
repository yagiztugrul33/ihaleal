    <!-- LCP preload — /ihaleal-logo-lockup.png (navbar lockup gorseli).
         LCP elemani Lighthouse `lcp-discovery-insight` ile dogrulandi; gorsel React
         render'i sonrasi kesfediliyordu (requestDiscoverable=false).

         Olcum gunlugu (yerel Lighthouse mobil, 5 tur medyan) — SIRA ONEMLI:
         1) Fontlar hala render-blocking iken bu preload FAYDA VERMEDI
            (LCP 4893 -> 4959 ms): 20 KB'lik gorsel, bant genisligi icin kritik JS
            ve 183 KB'lik woff2 kuyruguyla yarisiyordu.
         2) Fontlar kritik yoldan cikarildiktan SONRA ayni preload kazanca dondu
            (Perf 75 -> 77, LCP 4427 -> 4144 ms).
         Onceden burada /icon-192.png preload ediliyordu — LCP elemani O DEGIL. -->
    <link rel="preload" as="image" href="/ihaleal-logo-lockup.png" fetchpriority="high" />

    <!-- Gövde/başlık fontları: HTML head'de yüklenir ki tarayıcı ilk taramada keşfetsin.
         Daha önce src/styles/theme.css içinde @import ile geliyordu; font ancak paket CSS'i
         indikten sonra istenip geç swap ile düzen kaymasına (CLS) sebep oluyordu.

         media="print" + data-font-swap: stylesheet ILK BOYAMAYI BLOKLAMAZ; indikten
         sonra /font-loader.js media'yi "all" yapar. Olcum (yerel Lighthouse mobil,
         medyan): font stylesheet'i kritik yoldan cikinca Perf 74 -> 80,
         FCP 4214 -> 3070 ms. Ilk ekran, kritik CSS'teki metrik uyumlu
         "Inter Fallback" ile cizilir; swap kayma uretmez. -->
    <link
      rel="stylesheet"
      media="print"
      data-font-swap
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@500;600;700;800&display=swap"
    />
    <script src="/font-loader.js" defer></script>
