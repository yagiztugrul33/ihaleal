    <!-- HashRouter: boş hash → CSP uyumlu harici betik -->
    <script src="/hash-redirect.js"></script>
    <script>
      (function () {
        var k = "ihaleal_theme_rev";
        if (localStorage.getItem(k) !== "7") {
          localStorage.setItem(k, "7");
          if ("serviceWorker" in navigator) {
            navigator.serviceWorker.getRegistrations().then(function (r) {
              r.forEach(function (x) { x.unregister(); });
            });
          }
          if (window.caches) {
            caches.keys().then(function (n) { n.forEach(function (x) { caches.delete(x); }); });
          }
        }
      })();
    </script>
