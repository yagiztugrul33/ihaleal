# (C) Sunucuda otomatik doğrulama + review öncesi ipuçları.
# Cursor IDE veya Cloud Agent API anahtarı zorunlu değildir; istenirse ayrı iş akışına eklenir.

name: CI

on:
  push:
    branches: [main, master, develop]
  # PR: fork dahil; aşağıdaki verify + review-hints job’ları aynı mantıkla çalışır.
  pull_request:
  # Manuel: Actions → CI → “Run workflow” ile dal seçerek tetikleme.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Source encoding (src, tests/smoke, playwright.config)
        run: npm run precheck:encoding

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:run

      - name: Production build
        run: npm run build

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (Playwright)
        run: npm run test:smoke

  review-hints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review checklist (stdout)
        run: node scripts/ci-review-hints.mjs
