# (C) Sunucuda otomatik doğrulama + review öncesi ipuçları.
# Cursor IDE veya Cloud Agent API anahtarı zorunlu değildir; istenirse ayrı iş akışına eklenir.

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Tests
        run: npm run test:run

      - name: Production build
        run: npm run build

  review-hints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review checklist (stdout)
        run: node scripts/ci-review-hints.mjs
