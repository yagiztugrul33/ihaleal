# (C) Sunucuda otomatik doğrulama + review öncesi ipuçları.
# Cursor IDE veya Cloud Agent API anahtarı zorunlu değildir; istenirse ayrı iş akışına eklenir.
#
# Playbook #9: `npm run verify` — typecheck + encoding + vitest + build tek kapı (package.json ile drift yok).
# Playbook #10: Smoke kırılırsa `test-results/` artefakt (Playwright trace/screenshot; 7 gün saklama).

name: CI

on:
  push:
    branches: [main, master, develop]
  # PR: fork dahil; aşağıdaki verify + review-hints job’ları aynı mantıkla çalışır.
  pull_request:
  # Manuel: Actions → CI → “Run workflow” ile dal seçerek tetikleme.
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Verify + coverage gate + bundle budget + security lint/audit
        run: npm run verify:ci

      - name: Generate RLS matrix artifact
        run: npm run rls:matrix

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (Playwright)
        run: npm run test:smoke

      - name: Upload Playwright test-results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  review-hints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review checklist (stdout)
        run: node scripts/ci-review-hints.mjs
