# (C) Sunucuda otomatik dogrulama + review oncesi ipuclari. name: CI  on:   push:     branches: [main, master, develop]   pull_request:   workflow_dispatch:  concurrency:   group: ci-${{ github.workflow }}-${{ github.ref }}   cancel-in-progress: true  jobs:   verify:     runs-on: ubuntu-latest     timeout-minutes: 25     env:       NODE_ENV: development       CI: true     permissions:       contents: read       actions: write     steps:       - uses: actions/checkout@v4        - uses: actions/setup-node@v4         with:           node-version: "22"           cache: npm        - name: Install         run: |           npm ci --include=dev           node -e "require('@rollup/rollup-linux-x64-gnu')" 2>/dev/null || npm install @rollup/rollup-linux-x64-gnu@4.60.3 --no-save --no-package-lock        - run: npm run typecheck       - run: npm run precheck:encoding        - name: Validate env         run: npm run validate:env         env:           VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}           VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}        - run: npm run test:run        - name: Build         run: |           set -eo pipefail           node scripts/vite-build-safe.mjs         env:           NODE_OPTIONS: --max-old-space-size=8192           GITHUB_ACTIONS: "true"           DISABLE_PWA: "1"           VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}           VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}        - run: npm run test:rls       - run: npm run test:coverage       - run: node scripts/check-bundle-budget.mjs       - run: npm run lint:ci       - run: npm run security:audit       - run: npm run rls:matrix        - run: npx playwright install --with-deps chromium       - run: npx playwright test tests/smoke/arastirma-routes.spec.ts tests/smoke/demo-routes.spec.ts        - uses: actions/upload-artifact@v4         if: failure()         with:           name: playwright-test-results           path: test-results/           if-no-files-found: ignore           retention-days: 7    review-hints:     runs-on: ubuntu-latest     steps:       - uses: actions/checkout@v4       - run: node scripts/ci-review-hints.mjs 
