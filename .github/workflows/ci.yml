# Playbook #9: npm run verify â€” typecheck + encoding + vitest + build tek kapi.
# Playbook #10: Smoke kirilirsa test-results/ artefakt (7 gun saklama).

name: CI

on:
  push:
    branches: [main, master, develop]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: development
      CI: true
    permissions:
      contents: read
      actions: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: |
          npm ci --include=dev
          node -e "require('@rollup/rollup-linux-x64-gnu')" 2>/dev/null || npm install @rollup/rollup-linux-x64-gnu@4.60.3 --no-save --no-package-lock

      - name: Typecheck
        run: npm run typecheck

      - name: Encoding check
        run: npm run precheck:encoding

      - name: Validate env
        run: npm run validate:env
        env:
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Unit tests
        run: npm run test:run

      - name: Build
        run: |
          set -eo pipefail
          npm run build
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          GITHUB_ACTIONS: true

      - name: RLS tests
        run: npm run test:rls

      - name: Coverage gate
        run: npm run test:coverage

      - name: Bundle budget
        run: node scripts/check-bundle-budget.mjs

      - name: Lint CI
        run: npm run lint:ci

      - name: Security audit
        run: npm run security:audit

      - name: Generate RLS matrix artifact
        run: npm run rls:matrix

      - name: Install Playwright Chromium
        run: npx playwright install --with-deps chromium

      - name: Smoke tests (Playwright)
        run: npx playwright test tests/smoke/arastirma-routes.spec.ts tests/smoke/demo-routes.spec.ts

      - name: Upload Playwright test-results on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: playwright-test-results
          path: test-results/
          if-no-files-found: ignore
          retention-days: 7

  review-hints:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Review checklist (stdout)
        run: node scripts/ci-review-hints.mjs