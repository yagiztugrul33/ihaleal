name: Supabase v2 Deploy

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - "supabase/**"
      - ".github/workflows/supabase-v2-deploy.yml"

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - name: Link and push migrations
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase link --project-ref wsjifesrdaeorrdzbvmk
          npx supabase db push --include-all
      - name: Deploy edge functions
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
        run: |
          npx supabase functions deploy place-bid
          npx supabase functions deploy ai-price-estimate
          npx supabase functions deploy matching-fanout --no-verify-jwt
          npx supabase functions deploy bulk-listing-ingest
          npx supabase functions deploy kyc-submit
          npx supabase functions deploy report-notifier
          npx supabase functions deploy payments-iyzico
