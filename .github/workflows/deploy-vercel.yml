name: Deploy Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-deploy-production
  cancel-in-progress: true

jobs:
  # `secrets` bağlamı iş seviyesindeki `if:` içinde KULLANILAMAZ (GitHub bunu geçersiz
  # workflow sayıp hiç iş oluşturmadan kırmızı işaretliyordu). Token varlığı bu küçük
  # işte okunur, `deploy` işi çıktıya göre koşullanır. VERCEL_TOKEN tanımlı değilse
  # deploy atlanır (Vercel'in GitHub entegrasyonu zaten deploy ediyor).
  check:
    runs-on: ubuntu-latest
    outputs:
      has_token: ${{ steps.chk.outputs.has_token }}
    steps:
      - id: chk
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
        run: |
          if [ -n "$VERCEL_TOKEN" ]; then echo "has_token=true" >> "$GITHUB_OUTPUT"; else echo "has_token=false" >> "$GITHUB_OUTPUT"; fi

  deploy:
    needs: check
    if: needs.check.outputs.has_token == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      NODE_ENV: development
      CI: true
      DISABLE_PWA: "1"
      GITHUB_ACTIONS: "true"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: |
          npm ci --include=dev
          node -e "require('@rollup/rollup-linux-x64-gnu')" 2>/dev/null || npm install @rollup/rollup-linux-x64-gnu@4.60.3 --no-save --no-package-lock

      - name: Build
        run: |
          set -eo pipefail
          node scripts/vite-build-safe.mjs
        env:
          NODE_OPTIONS: --max-old-space-size=8192
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Install Vercel CLI
        run: npm install -g vercel@latest

      - name: Pull Vercel settings
        run: vercel pull --yes --environment=production
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      - name: Vercel build output
        run: vercel build --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}
          DISABLE_PWA: "1"
          NODE_OPTIONS: --max-old-space-size=8192

      - name: Deploy prebuilt to production
        run: vercel deploy --prebuilt --prod
        env:
          VERCEL_TOKEN: ${{ secrets.VERCEL_TOKEN }}
          VERCEL_ORG_ID: ${{ secrets.VERCEL_ORG_ID }}
          VERCEL_PROJECT_ID: ${{ secrets.VERCEL_PROJECT_ID }}

      # Yandex + Bing'e "sayfalar değişti" sinyalini anında iter (Google zaten
      # Search Console + crawl ile kendi hızında geliyor). Deploy'u
      # bloklamasın diye ayrı adım + continue-on-error.
      - name: Notify search engines via IndexNow
        run: npm run seo:indexnow
        continue-on-error: true
