name: Deploy Vercel Production

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: vercel-prod-${{ github.ref }}
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm

      - name: Install
        run: npm ci

      - name: Build
        run: |
          set -euxo pipefail
          rm -rf node_modules/.tmp dist
          node -v && npm -v
          npm ls @rollup/rollup-linux-x64-gnu || npm install @rollup/rollup-linux-x64-gnu@4.60.3 --no-save
          npm run build:vercel
          test -f dist/index.html
          grep -o 'assets/index-[^"]*\.js' dist/index.html | head -1
          ls -la dist/assets/index-*.js
        env:
          NODE_OPTIONS: --max-old-space-size=4096
          VERCEL_FORCE_NO_BUILD_CACHE: "1"
          VITE_SUPABASE_URL: ${{ secrets.VITE_SUPABASE_URL }}
          VITE_SUPABASE_ANON_KEY: ${{ secrets.VITE_SUPABASE_ANON_KEY }}

      - name: Deploy to Vercel (production)
        uses: amondnet/vercel-action@v25
        id: vercel
        with:
          vercel-token: ${{ secrets.VERCEL_TOKEN }}
          vercel-org-id: ${{ secrets.VERCEL_ORG_ID }}
          vercel-project-id: ${{ secrets.VERCEL_PROJECT_ID }}
          vercel-args: "--prod --force"
          working-directory: ./

      - name: Deployment URL
        run: echo "Production URL ${{ steps.vercel.outputs.preview-url }}"